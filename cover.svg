<text x="455" y="824" font-size="16" fill="#8b98a4">每帖上限 32 页（4 的倍数）</text>
<rect x="786" y="700" width="333" height="140" rx="12" fill="#fbeeea"/>
<text x="808" y="740" font-size="20" fill="#5a6d84">最内一张内移</text>
<text x="808" y="792" font-size="40" font-weight="700" fill="#b4442c">0.80 mm</text>
<text x="808" y="824" font-size="16" fill="#8b98a4">按外张切齐裁 0.80 mm</text>

<text x="80" y="874" font-size="27" font-weight="700" fill="#22344e">要点</text>
<text x="80" y="908" font-size="21" fill="#4d6076">· 第 1 张：第 1 面「20 | 1」、第 2 面「2 | 19」——对折展开正好是 1–4 页</text>
<text x="80" y="945" font-size="21" fill="#4d6076">· 翻面方式：左右方向对调、上下不变；印完先对折一张自检「1 | 2」对上「3 | 4」</text>
<text x="80" y="982" font-size="21" fill="#4d6076">· 内移只挪内容、不用裁：最外一张 0，往后每张多 0.20 mm，最内一张 0.80 mm</text>
<text x="80" y="1019" font-size="21" fill="#4d6076">· 爬移是线性模型：每层厚 = 层厚系数 2 × 纸厚 0.10 mm；厚度与页数由你填，页面不联网</text>

<rect y="1136" width="1200" height="64" fill="#f4f8fb"/>
